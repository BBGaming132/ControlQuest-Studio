<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ControlQuest Studio | CISA Study Companion</title>
  <meta name="description" content="A Firebase-backed CISA study companion that adds gamification, groups, scheduling, notes, rewards, and progress tracking on top of ISACA QAE and study tools." />
  <link rel="icon" href="assets/icons/logo-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="boot-screen">
    <div class="boot-card">
      <img src="assets/icons/logo-mark.svg" alt="ControlQuest Studio Logo" />
      <h1>ControlQuest Studio</h1>
      <p>Loading your CISA quest...</p>
    </div>
  </div>
  <div id="toastLayer" class="toast-layer" aria-live="polite"></div>

  <script>
    window.__cqBootStart = Date.now();
    function cqBootMessage(title, body) {
      var app = document.getElementById('app');
      if (!app || !app.classList.contains('boot-screen')) return;
      var panel = app.querySelector('.boot-card');
      if (!panel) return;
      panel.innerHTML = '<img src="assets/icons/logo-mark.svg" alt="ControlQuest Studio Logo" />' +
        '<h1>' + title + '</h1>' +
        '<p>' + body + '</p>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">' +
        '<button onclick="location.reload()" style="border:0;border-radius:14px;padding:10px 14px;background:#7c4dff;color:white;font-weight:800;cursor:pointer">Reload Site</button>' +
        '<button onclick="alert('Open DevTools with F12 or Right Click → Inspect → Console. Copy any red error text.')" style="border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.08);color:white;font-weight:800;cursor:pointer">How To Check Console</button>' +
        '</div>';
    }
    window.addEventListener('error', function(e){
      cqBootMessage('ControlQuest Hit A Loading Error', (e && e.message ? e.message : 'A script failed before the app could load.') + ' Check that js/app.js, js/firebase-service.js, css/styles.css, and config/firebase-config.js are all uploaded.');
    });
    window.addEventListener('unhandledrejection', function(e){
      var msg = e && e.reason && (e.reason.message || e.reason.toString()) || 'A startup promise failed.';
      cqBootMessage('ControlQuest Hit A Startup Error', msg);
    });
    setTimeout(function(){
      var app = document.getElementById('app');
      if (app && app.classList.contains('boot-screen')) {
        cqBootMessage('Still Loading After 12 Seconds', 'This usually means Firebase CDN modules, js/app.js, or config/firebase-config.js did not load. Hard refresh with Ctrl + Shift + R, then check the browser console for the first red error.');
      }
    }, 12000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
